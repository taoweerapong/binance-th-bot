name: Crypto Trading Bot

on:
  schedule:
    - cron: '10 1 * * *'
  workflow_dispatch:          # ปุ่มกดรันเอง

permissions:
  contents: write             # ให้สิทธิ์ commit state กลับ repo

concurrency:
  group: trading-bot
  cancel-in-progress: false   # กันรันซ้อนกัน

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          BINANCE_TH_API_KEY:    ${{ secrets.BINANCE_API_KEY }}
          BINANCE_TH_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          SYMBOL:   'BTCTHB'
          AMOUNT:   '500'
          INTERVAL: '1d'
          DRY_RUN:  'true'      # เปลี่ยนเป็น 'false' เมื่อพร้อมเทรดจริง
          FEE_RATE: '0.0025'    # ปรับตามอัตราจริงของคุณ
          SLIPPAGE: '0.0005'
          MIN_EDGE: '0.005'
        run: python bot.py

      - name: Commit state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/state
          cp -f bot_log.txt bot_state.json /tmp/state/ 2>/dev/null || true

          for i in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B main origin/main
            cp -f /tmp/state/bot_log.txt /tmp/state/bot_state.json . 2>/dev/null || true

            git add bot_log.txt bot_state.json
            git diff --cached --quiet && { echo "ไม่มีอะไรเปลี่ยน"; exit 0; }
            git commit -m "state: $(date -u +'%Y-%m-%d %H:%M UTC')"

            git push origin main && exit 0
            echo "push ชนกัน ลองใหม่รอบที่ $i..."
            sleep 8
          done
          exit 1
