name: Crypto Trading Bot

on:
  schedule:
    - cron: '5 * * * *'      # ทุกชั่วโมง นาทีที่ 5 (UTC)
  workflow_dispatch:          # ปุ่มกดรันเอง

permissions:
  contents: write             # ให้สิทธิ์ commit state กลับ repo

concurrency:
  group: trading-bot
  cancel-in-progress: false   # กันรันซ้อนกัน

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          BINANCE_TH_API_KEY:    ${{ secrets.BINANCE_API_KEY }}
          BINANCE_TH_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          SYMBOL:   'BTCTHB'
          AMOUNT:   '500'
          INTERVAL: '1h'
          DRY_RUN:  'true'      # เปลี่ยนเป็น 'false' เมื่อพร้อมเทรดจริง
        run: python bot.py


      - name: Commit state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add bot_log.txt bot_state.json
          git diff --cached --quiet && { echo "ไม่มีอะไรเปลี่ยน"; exit 0; }
          git commit -m "state: $(date -u +'%Y-%m-%d %H:%M UTC')"

          for i in 1 2 3; do
            git fetch origin main
            git rebase -X theirs origin/main || git rebase --abort
            git push origin HEAD:main && exit 0
            echo "push ชนกัน ลองใหม่..."
            sleep 10
          done
          exit 1
