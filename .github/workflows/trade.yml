name: Crypto Trading Bot

on:
  schedule:
    - cron: '5 * * * *'      # ทุกชั่วโมง นาทีที่ 5 (UTC)
  workflow_dispatch:          # ปุ่มกดรันเอง

permissions:
  contents: write             # ให้สิทธิ์ commit state กลับ repo

concurrency:
  group: trading-bot
  cancel-in-progress: false   # กันรันซ้อนกัน

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          BINANCE_TH_API_KEY:    ${{ secrets.BINANCE_TH_API_KEY }}
          BINANCE_TH_API_SECRET: ${{ secrets.BINANCE_TH_API_SECRET }}
          SYMBOL:   'BTCTHB'
          AMOUNT:   '500'
          INTERVAL: '1h'
          DRY_RUN:  'true'      # เปลี่ยนเป็น 'false' เมื่อพร้อมเทรดจริง
        run: python bot.py

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git fetch origin main
          git checkout main || git checkout -b main origin/main
        
          git add bot_state.json
          
          if ! git diff --cached --quiet; then
            git commit -m "state: update bot state $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes in bot_state.json to commit."
          fi
